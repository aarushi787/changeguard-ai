# Free pilot service. Sleeps when idle; documents persist in the Supabase database.
services:
  - type: web
    name: changeguard-api
    runtime: docker
    repo: https://github.com/aarushi787/changeguard-ai
    branch: main
    region: singapore
    plan: free
    numInstances: 1
    healthCheckPath: /api/v1/health
    dockerCommand: python -m scripts.start_cloud
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: APP_ORIGIN
        value: https://changeguard-ai.vercel.app
      - key: ALLOW_REGISTRATION
        value: "0"
      - key: RUN_WORKER
        value: "1"
      - key: STORAGE_PATH
        value: /app/data/documents
      - key: STORAGE_BACKEND
        value: database
      - key: RESTORE_BUNDLED_DEMO
        value: "1"
