services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: changeguard
      POSTGRES_USER: changeguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U changeguard -d changeguard"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  migrate:
    build: .
    command: [alembic, upgrade, head]
    environment:
      DATABASE_URL: postgresql+psycopg://changeguard:${POSTGRES_PASSWORD}@db:5432/changeguard
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment: &app_environment
      DATABASE_URL: postgresql+psycopg://changeguard:${POSTGRES_PASSWORD}@db:5432/changeguard
      ENVIRONMENT: production
      APP_ORIGIN: ${APP_ORIGIN:-https://localhost}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-0}
      RUN_WORKER: "0"
    volumes:
      - documents:/app/data/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    command: [python, -m, backend.worker]
    environment: *app_environment
    volumes:
      - documents:/app/data/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  gateway:
    image: caddy:2-alpine
    ports:
      - "443:443"
      - "80:80"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
volumes:
  postgres_data:
  documents:
  caddy_data:
  caddy_config:
