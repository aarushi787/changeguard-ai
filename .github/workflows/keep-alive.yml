name: Keep Render Backend Alive

on:
  schedule:
    - cron: "*/10 * * * *" # Runs every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: curl -s -f https://changeguard-api.onrender.com/api/v1/auth/me > /dev/null || true
