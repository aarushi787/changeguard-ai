name: Verify ChangeGuard
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: changeguard_test
          POSTGRES_USER: changeguard
          POSTGRES_PASSWORD: ci_ephemeral_only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U changeguard -d changeguard_test" --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npm run build
      - run: python -m pytest -q
      - name: PostgreSQL migration
        run: python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://changeguard:ci_ephemeral_only@localhost:5432/changeguard_test
      - name: PostgreSQL API and parser suite
        run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://changeguard:ci_ephemeral_only@localhost:5432/changeguard_test
